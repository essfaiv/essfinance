name: Tests

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  # ── Plugin header consistency ─────────────────────────────────────────────────
  headers:
    name: Plugin header consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required header fields exist
        run: |
          check_field() {
            local label=$1 pattern=$2 file=$3
            if ! grep -qE "$pattern" "$file"; then
              echo "✗  '$label' not found in $file"
              exit 1
            fi
            echo "✔  $label: $(grep -oE "$pattern" "$file" | head -1)"
          }

          check_field "Plugin Name"       "Plugin Name:"                 "essfinance.php"
          check_field "Version"           "Version: [0-9]+\.[0-9]"      "essfinance.php"
          check_field "Requires at least" "Requires at least: [0-9]"    "essfinance.php"
          check_field "Requires PHP"      "Requires PHP: [0-9]"         "essfinance.php"
          check_field "Tested up to"      "Tested up to: [0-9]"         "essfinance.php"
          check_field "License"           "License: GPL"                 "essfinance.php"
          check_field "readme Stable tag" "Stable tag: [0-9]+\.[0-9]"  "readme.txt"

      - name: Version == Stable tag
        run: |
          MAIN=$(grep -oP "(?<=Version: )\S+" essfinance.php)
          README=$(grep -oP "(?<=Stable tag: )\S+" readme.txt)
          [ "$MAIN" = "$README" ] && echo "✔  Version: $MAIN" || { echo "✗  Mismatch: essfinance.php=$MAIN readme.txt=$README"; exit 1; }

      - name: Requires at least consistent
        run: |
          MAIN=$(grep -oP "(?<=Requires at least: )\S+" essfinance.php)
          README=$(grep -oP "(?<=Requires at least: )\S+" readme.txt)
          [ "$MAIN" = "$README" ] && echo "✔  Requires at least: $MAIN" || { echo "✗  Mismatch: $MAIN vs $README"; exit 1; }

      - name: Requires PHP consistent
        run: |
          MAIN=$(grep -oP "(?<=Requires PHP: )\S+" essfinance.php)
          README=$(grep -oP "(?<=Requires PHP: )\S+" readme.txt)
          [ "$MAIN" = "$README" ] && echo "✔  Requires PHP: $MAIN" || { echo "✗  Mismatch: $MAIN vs $README"; exit 1; }

  # ── PHPCS + WPCS + PHPCompatibility ──────────────────────────────────────────
  # Mirrors exactly what the .githooks/pre-commit runs locally.
  phpcs:
    name: PHPCS / WPCS / PHP Compat (7.2+)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: $(composer config cache-files-dir)
          key: composer-phpcs-${{ hashFiles('composer.json') }}
          restore-keys: composer-phpcs-

      - name: Install dependencies (no scripts — hooks not needed in CI)
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: PHPCS
        run: composer lint

  # ── PHPUnit ──────────────────────────────────────────────────────────────────
  # PHPUnit 10 requires PHP >= 8.1. Production code compat is checked via PHPCS above.
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: $(composer config cache-files-dir)
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: PHPUnit
        run: composer test

      - name: Upload coverage
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: tests/coverage/

  # ── PHPStan ──────────────────────────────────────────────────────────────────
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: PHPStan
        run: composer analyse

  # ── Playwright E2E ───────────────────────────────────────────────────────────
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: false  # Enable once a CI WordPress environment is configured.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          ESSF_BASE_URL: ${{ secrets.ESSF_BASE_URL }}
          ESSF_ADMIN_USER: ${{ secrets.ESSF_ADMIN_USER }}
          ESSF_ADMIN_PASS: ${{ secrets.ESSF_ADMIN_PASS }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
