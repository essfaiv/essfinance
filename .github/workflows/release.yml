name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p /tmp/build/essfinance
          rsync -r --exclude='.git/' --exclude='.github/' --exclude='*.zip' \
            . /tmp/build/essfinance/
          cd /tmp/build
          zip -r essfinance.zip essfinance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/build/essfinance.zip
          generate_release_notes: true
