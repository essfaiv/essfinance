name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build plugin zip
        run: |
          mkdir -p /tmp/build
          git archive HEAD --prefix=essfinance/ | tar xf - -C /tmp/build/

          git -C lib/selfdirectory archive HEAD \
            --prefix=essfinance/lib/selfdirectory/ \
            -- class-selfdirectory.php \
            | tar xf - -C /tmp/build/

          cd /tmp/build
          zip -r essfinance.zip essfinance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/build/essfinance.zip
          generate_release_notes: true
